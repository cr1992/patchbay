<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Patchbay — a typed control plane for running Flutter apps</title>
  <desc id="desc">A terminal connects through a guarded Patchbay control plane to a running Flutter app, exposing typed state, domain commands, stable UI targets, and redacted logs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c101d"/>
      <stop offset="0.55" stop-color="#11172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58f3c2"/>
      <stop offset="0.48" stop-color="#63b8ff"/>
      <stop offset="1" stop-color="#b77cff"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58f3c2" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#63b8ff"/>
      <stop offset="1" stop-color="#b77cff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#65c7ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#65c7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9db0d0" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="640" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#grid)"/>
    <circle cx="640" cy="335" r="330" fill="url(#glow)"/>
    <circle cx="90" cy="70" r="180" fill="#58f3c2" opacity="0.035"/>
    <circle cx="1205" cy="540" r="250" fill="#b77cff" opacity="0.04"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g transform="translate(68 58)">
        <g transform="translate(0 2)">
          <rect x="0" y="0" width="39" height="39" rx="11" fill="#111a2e" stroke="#58f3c2" stroke-opacity="0.55"/>
          <circle cx="12" cy="13" r="3.2" fill="#58f3c2"/>
          <circle cx="27" cy="13" r="3.2" fill="#63b8ff"/>
          <circle cx="12" cy="27" r="3.2" fill="#63b8ff"/>
          <circle cx="27" cy="27" r="3.2" fill="#b77cff"/>
          <path d="M12 13C21 13 17 27 27 27M27 13C19 13 20 27 12 27" fill="none" stroke="#d8e4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.78"/>
        </g>
        <text x="55" y="32" fill="#f3f7ff" font-size="34" font-weight="760" letter-spacing="5">PATCHBAY</text>
        <text x="294" y="31" fill="#7987a5" font-size="12" font-weight="650" letter-spacing="2.4">FLUTTER RUNTIME CONTROL PLANE</text>
      </g>

      <g transform="translate(1000 65)">
        <rect width="212" height="30" rx="15" fill="#182038" stroke="#ffca6a" stroke-opacity="0.3"/>
        <circle cx="18" cy="15" r="4" fill="#ffca6a"/>
        <text x="31" y="20" fill="#d9e3f7" font-size="11" font-weight="700" letter-spacing="1.35">DEBUG / PROFILE ONLY</text>
      </g>

      <text x="640" y="152" text-anchor="middle" fill="#f7f9ff" font-size="34" font-weight="680" letter-spacing="-0.7">Talk to your app while it is running.</text>
      <text x="640" y="184" text-anchor="middle" fill="#93a2c0" font-size="16" letter-spacing="0.2">Typed state in. Guarded commands out. No coordinate roulette.</text>

      <g filter="url(#shadow)">
        <g transform="translate(68 230)">
          <rect width="365" height="247" rx="19" fill="#0c1221" stroke="#33405d"/>
          <path d="M0 48H365" stroke="#2a3652"/>
          <circle cx="22" cy="24" r="5" fill="#ff6e7f"/>
          <circle cx="40" cy="24" r="5" fill="#ffca6a"/>
          <circle cx="58" cy="24" r="5" fill="#58f3c2"/>
          <text x="182.5" y="29" text-anchor="middle" fill="#70809f" font-size="11" font-weight="650" letter-spacing="1.5">TERMINAL</text>
          <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5">
            <text x="24" y="83" fill="#58f3c2">$</text><text x="43" y="83" fill="#d8e4fa">patchbay identity</text>
            <text x="24" y="117" fill="#58f3c2">$</text><text x="43" y="117" fill="#d8e4fa">patchbay --json snapshot</text>
            <text x="24" y="151" fill="#58f3c2">$</text><text x="43" y="151" fill="#d8e4fa">patchbay exec example.job.run</text>
            <text x="24" y="185" fill="#58f3c2">$</text><text x="43" y="185" fill="#d8e4fa">patchbay capture root</text>
            <text x="24" y="219" fill="#58f3c2">$</text><text x="43" y="219" fill="#d8e4fa">patchbay logs tail</text>
            <rect x="199" y="205" width="7" height="17" rx="1" fill="#58f3c2" opacity="0.8"/>
          </g>
        </g>

        <g transform="translate(847 230)">
          <rect width="365" height="247" rx="19" fill="#0c1221" stroke="#33405d"/>
          <path d="M0 48H365" stroke="#2a3652"/>
          <rect x="20" y="15" width="20" height="20" rx="6" fill="#65baff" fill-opacity="0.14" stroke="#65baff" stroke-opacity="0.6"/>
          <path d="M26 26l4-6 4 6-4 5z" fill="#65baff"/>
          <text x="52" y="29" fill="#dfe8fa" font-size="12" font-weight="700" letter-spacing="1.2">RUNNING FLUTTER APP</text>
          <g transform="translate(23 70)">
            <rect width="319" height="40" rx="10" fill="#111a2d"/>
            <circle cx="20" cy="20" r="5" fill="#58f3c2"/>
            <text x="37" y="25" fill="#dbe5f7" font-size="13" font-weight="600">typed runtime state</text>
            <text x="285" y="25" text-anchor="end" fill="#58f3c2" font-size="10" font-weight="750">READ</text>
            <rect y="50" width="319" height="40" rx="10" fill="#111a2d"/>
            <circle cx="20" cy="70" r="5" fill="#63b8ff"/>
            <text x="37" y="75" fill="#dbe5f7" font-size="13" font-weight="600">domain controllers</text>
            <text x="285" y="75" text-anchor="end" fill="#63b8ff" font-size="10" font-weight="750">INVOKE</text>
            <rect y="100" width="319" height="40" rx="10" fill="#111a2d"/>
            <circle cx="20" cy="120" r="5" fill="#b77cff"/>
            <text x="37" y="125" fill="#dbe5f7" font-size="13" font-weight="600">stable UI targets</text>
            <text x="285" y="125" text-anchor="end" fill="#b77cff" font-size="10" font-weight="750">ACT</text>
            <rect y="150" width="319" height="40" rx="10" fill="#111a2d"/>
            <circle cx="20" cy="170" r="5" fill="#ffca6a"/>
            <text x="37" y="175" fill="#dbe5f7" font-size="13" font-weight="600">redacted evidence</text>
            <text x="285" y="175" text-anchor="end" fill="#ffca6a" font-size="10" font-weight="750">STREAM</text>
          </g>
        </g>
      </g>

      <path d="M433 352C495 352 503 352 541 352" fill="none" stroke="url(#cable)" stroke-width="3"/>
      <path d="M739 352C777 352 785 352 847 352" fill="none" stroke="url(#cable)" stroke-width="3"/>
      <circle cx="466" cy="352" r="5" fill="#58f3c2" opacity="0.25" filter="url(#softGlow)"/>
      <circle cx="814" cy="352" r="5" fill="#b77cff" opacity="0.25" filter="url(#softGlow)"/>
      <path d="M453 345l10 7-10 7" fill="none" stroke="#58f3c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M827 345l-10 7 10 7" fill="none" stroke="#b77cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(527 254)" filter="url(#shadow)">
        <circle cx="113" cy="98" r="101" fill="#0d1527" stroke="#3a4c70"/>
        <circle cx="113" cy="98" r="82" fill="none" stroke="url(#brand)" stroke-width="2.5" opacity="0.75"/>
        <circle cx="113" cy="98" r="69" fill="#111b30"/>
        <g transform="translate(82 47)">
          <rect width="62" height="62" rx="18" fill="#0d172a" stroke="#64c5ff" stroke-opacity="0.55"/>
          <circle cx="19" cy="20" r="5" fill="#58f3c2"/>
          <circle cx="43" cy="20" r="5" fill="#63b8ff"/>
          <circle cx="19" cy="43" r="5" fill="#63b8ff"/>
          <circle cx="43" cy="43" r="5" fill="#b77cff"/>
          <path d="M19 20c14 0 9 23 24 23M43 20C29 20 33 43 19 43" fill="none" stroke="#edf5ff" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="113" y="134" text-anchor="middle" fill="#eef4ff" font-size="15" font-weight="750" letter-spacing="2">GUARDED</text>
        <text x="113" y="153" text-anchor="middle" fill="#8393b2" font-size="10" font-weight="650" letter-spacing="1.5">CONTROL PLANE</text>
      </g>

      <g transform="translate(176 538)">
        <g><rect width="210" height="40" rx="20" fill="#121c30" stroke="#58f3c2" stroke-opacity="0.25"/><circle cx="24" cy="20" r="4" fill="#58f3c2"/><text x="39" y="25" fill="#b9c7df" font-size="11" font-weight="700" letter-spacing="1">TYPED STATE</text></g>
        <g transform="translate(230)"><rect width="210" height="40" rx="20" fill="#121c30" stroke="#63b8ff" stroke-opacity="0.25"/><circle cx="24" cy="20" r="4" fill="#63b8ff"/><text x="39" y="25" fill="#b9c7df" font-size="11" font-weight="700" letter-spacing="1">DOMAIN COMMANDS</text></g>
        <g transform="translate(460)"><rect width="210" height="40" rx="20" fill="#121c30" stroke="#b77cff" stroke-opacity="0.25"/><circle cx="24" cy="20" r="4" fill="#b77cff"/><text x="39" y="25" fill="#b9c7df" font-size="11" font-weight="700" letter-spacing="1">STABLE UI IDs</text></g>
        <g transform="translate(690)"><rect width="210" height="40" rx="20" fill="#121c30" stroke="#ffca6a" stroke-opacity="0.25"/><circle cx="24" cy="20" r="4" fill="#ffca6a"/><text x="39" y="25" fill="#b9c7df" font-size="11" font-weight="700" letter-spacing="1">REDACTED LOGS</text></g>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="639" rx="27.5" fill="none" stroke="#40506d" stroke-opacity="0.55"/>
</svg>
