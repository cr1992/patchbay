# Patchbay 独立仓 CI。四条 lane 只选择 `tool/repo_tasks.dart` 中的仓内任务；包清单、
# 命令与顺序不在 GitLab / GitHub 两边重复维护。

default:
  tags:
    - podman-par
  # 镜像地址由 GitLab 项目级 CI/CD 变量 PATCHBAY_CI_IMAGE 提供（Flutter 3.44.9）。
  image: $PATCHBAY_CI_IMAGE
  interruptible: true

# 共享 Flutter 镜像默认指向第三方 Pub 镜像；该镜像从 GitLab runner 访问时可能持续
# 返回 authorization failed。Patchbay 只依赖公开包，显式回到官方源，也与 GitHub CI
# 的默认解析来源保持一致，避免基础镜像的下载源选择静默改变本仓门禁结果。
variables:
  PUB_HOSTED_URL: "https://pub.dev"

stages: [check, sdk_floor_check]

# PB-050-12：**已验证下限的守门 lane。** 它跑的版本就是 pubspec 声明的下限
# （Flutter 3.44.0 / Dart 3.12.0），只解压这一份 SHA-256 固定的 archive 并把它插到
# PATH 最前面验证，不改变默认镜像的 3.44.9 全局 SDK，也不影响开发者本地 Flutter。
# 跑红即代表声明下限不再成立，必须阻断——修复方向只有「修代码让下限重新成立」或
# 「再走一次 Proposal 调整下限数字」，不允许重新挂上 allow_failure 消音。
#
# 下限为什么是 3.44.0：旧声明（Flutter >=3.38.0 + Dart >=3.11.0）指向一个装不出来的
# 组合（3.38.x 全系只内置 Dart 3.10.x）；最早可安装的 3.41.x 又缺 Flutter 上游提交
# af35e77c83d，在那之前 Semantics(identifier:) 不构成语义边界，导致 ui.reveal 的遮挡
# 判定 fail-open。含该修复的第一个 stable 就是 3.44.0，且实测五个包全绿。完整事实链
# 与裁决见 docs/proposals/0.5.0/sdk-floor-raise.md。
#
# 独立 stage、排在 check 之后：GitLab 同 stage 默认并行调度，实测证明这条 lane 拉取
# 解压 2.2GB archive 再对五个包 analyze+test（约 8m26s）会在同一 runner 上和 check
# stage 的三条 job 抢 CPU/内存/磁盘 I/O，曾把 dart_packages 里一个平时稳定的 30s
# 超时用例顶爆（pipeline 6005 实测复现）。放进之后一个 stage 是为了让它在其余三条
# 跑完、runner 上没有并发负载之后再起跑，不是为了排队等它们“批准”。
#
# archive 取用顺序（pipeline 31482 实测：runner 到外网源只有约 0.5 MiB/s，1.469 GiB
# 每次全量重下要近 50 分钟，曾把整条 job 顶到 1 小时超时边缘）：
# 1. 先取本项目 generic 包仓（局域网，秒级）；
# 2. 未命中才回退外网源，SHA-256 校验通过后自动回传包仓（自播种），此后所有流水线
#    走包仓。播种失败只告警不阻断——下次重新走外网即可，不引入第二个失败面。
# 完整性锚不变：无论从哪个源取到，都必须过同一行 SHA-256 校验才会被使用或回传；
# 包仓路径含 floor 版本号，floor 经 Proposal 调整后新路径自然未命中并重新播种。
# GitHub 侧经 subosito/flutter-action 按版本号取 SDK 并自带缓存；两边验证同一版本，
# 并选择同一个 `repo_tasks.dart sdk-floor` 任务。
sdk_floor:
  stage: sdk_floor_check
  # coverage 是供人下载的报告，不是下限验证输入；避免 GitLab 跨 stage 默认拉取。
  dependencies: []
  variables:
    SDK_FLOOR_ARCHIVE_URL: https://storage.flutter-io.cn/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz
    SDK_FLOOR_ARCHIVE_CACHE_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/flutter-sdk-floor/3.44.0/flutter_linux_3.44.0-stable.tar.xz
    SDK_FLOOR_ARCHIVE_SHA256: e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5
    SDK_FLOOR_ARCHIVE_PATH: $CI_PROJECT_DIR/.ci/flutter-sdk-floor.tar.xz
    SDK_FLOOR_FLUTTER_DIR: $CI_PROJECT_DIR/.ci/flutter
  script:
    - mkdir -p "$CI_PROJECT_DIR/.ci"
    - |
      if curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --output "$SDK_FLOOR_ARCHIVE_PATH" "$SDK_FLOOR_ARCHIVE_CACHE_URL"; then
        SDK_FLOOR_ARCHIVE_ORIGIN=registry
        echo "archive 取自项目包仓"
      else
        SDK_FLOOR_ARCHIVE_ORIGIN=external
        echo "包仓未命中，回退外网源（校验通过后将自动播种包仓）"
        curl --fail --location --retry 3 --output "$SDK_FLOOR_ARCHIVE_PATH" "$SDK_FLOOR_ARCHIVE_URL"
      fi
    - echo "$SDK_FLOOR_ARCHIVE_SHA256  $SDK_FLOOR_ARCHIVE_PATH" | sha256sum --check
    - |
      if [ "$SDK_FLOOR_ARCHIVE_ORIGIN" = external ]; then
        if curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$SDK_FLOOR_ARCHIVE_PATH" "$SDK_FLOOR_ARCHIVE_CACHE_URL"; then
          echo "已播种到项目包仓，后续流水线走局域网"
        else
          echo "播种包仓失败（不阻断）：本次继续，下次流水线仍走外网源"
        fi
      fi
    - tar --no-same-owner -xJf "$SDK_FLOOR_ARCHIVE_PATH" -C "$CI_PROJECT_DIR/.ci"
    - export PATH="$SDK_FLOOR_FLUTTER_DIR/bin:$PATH"
    - dart run tool/repo_tasks.dart sdk-floor

# dart_packages 内含 packages/patchbay/test/command_name_parity_test.dart ——
# 命令名跨包一致护栏（CLI/服务方/fixture 三处钉死）。
dart_packages:
  stage: check
  script:
    - dart run tool/repo_tasks.dart dart-packages

flutter_package:
  stage: check
  script:
    - dart run tool/repo_tasks.dart flutter-package

# 四个生成器（含 README 命令参考）都在这里查零漂移。
# wire：生成物 header 记录仓根相对路径，--check 必须从仓根调用（包目录内跑会假漂移）。
# command：header 记录的是相对生成物自身的路径，从哪个目录调用都一致，不必迁就 cwd。
codegen_drift:
  stage: check
  script:
    - dart run tool/repo_tasks.dart codegen-drift

# PB-060-07：只建立逐包 branch coverage 地图，不设百分比硬门。采集失败会把
# job 标成 warning 并保留已有 artifact，但不阻断 0.6.0；形成稳定基线后再另行
# 裁决生成代码、平台不可达分支与分包下限。
coverage:
  stage: check
  allow_failure: true
  variables:
    PATCHBAY_DART_TEST_TIMEOUT: 90s
  script:
    - dart run tool/repo_tasks.dart coverage
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage/
