# Patchbay 独立仓 CI：全仓排版 + 四包 analyze + test + 生成物零漂移，外加一条非阻断的
# 最低 SDK 探测 lane。
# 双 CI 并行：GitLab（本文件）+ GitHub Actions（.github/workflows/ci.yml，公开仓协作门禁），
# 四 job 两边一一对应，改动需同步。

default:
  tags:
    - podman-par
  # 镜像地址由 GitLab 项目级 CI/CD 变量 PATCHBAY_CI_IMAGE 提供（Flutter 3.44.9）。
  image: $PATCHBAY_CI_IMAGE
  interruptible: true

stages: [check, sdk_floor_check]

# PB-050-12：声明的 Flutter 下限（>=3.38.0）与 Dart 下限（>=3.11.0）无法在同一个真实
# Flutter release 上同时成立——3.38.x 全系只内置 Dart 3.10.x。两个约束共同要求的最早
# 可安装 Flutter release 是 3.41.0（内置 Dart 3.11.0），这条 lane 只解压这一份
# SHA-256 固定的 archive 并把它插到 PATH 最前面验证，不改变默认镜像的 3.44.9 全局
# SDK，也不影响开发者本地 Flutter。
#
# 独立 stage、排在 check 之后：GitLab 同 stage 默认并行调度，实测证明这条 lane 拉取
# 解压 2.2GB archive 再对五个包 analyze+test（约 8m26s）会在同一 runner 上和 check
# stage 的三条 job 抢 CPU/内存/磁盘 I/O，曾把 dart_packages 里一个平时稳定的 30s
# 超时用例顶爆（pipeline 6005 实测复现）。放进之后一个 stage 是为了让它在其余三条
# 跑完、runner 上没有并发负载之后再起跑，不是为了排队等它们“批准”。
#
# allow_failure：截至本次调查，3.41.0 在本地 macOS arm64 复现下未能通过既有的
# reveal 终止条件矩阵一条断言（详情见 docs/verification/0.5.0-flutter-sdk-floor.md）；
# 该复现还没有在 Linux 上复核过，是否同样失败仍待这条 lane 的真实结果确认。在结论
# 明朗前先非阻断跑，避免用一个还没坐实是否可稳定复现的失败卡住其余三条 lane。
sdk_floor:
  stage: sdk_floor_check
  allow_failure: true
  variables:
    SDK_FLOOR_ARCHIVE_URL: https://storage.flutter-io.cn/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.0-stable.tar.xz
    SDK_FLOOR_ARCHIVE_SHA256: 368ae5b6993c51861324e704c42d61c4e290fba7213a88fd0e9fec15ded54599
    SDK_FLOOR_ARCHIVE_PATH: $CI_PROJECT_DIR/.ci/flutter-sdk-floor.tar.xz
    SDK_FLOOR_FLUTTER_DIR: $CI_PROJECT_DIR/.ci/flutter
  script:
    - mkdir -p "$CI_PROJECT_DIR/.ci"
    - curl --fail --location --retry 3 --output "$SDK_FLOOR_ARCHIVE_PATH" "$SDK_FLOOR_ARCHIVE_URL"
    - echo "$SDK_FLOOR_ARCHIVE_SHA256  $SDK_FLOOR_ARCHIVE_PATH" | sha256sum --check
    - tar --no-same-owner -xJf "$SDK_FLOOR_ARCHIVE_PATH" -C "$CI_PROJECT_DIR/.ci"
    - export PATH="$SDK_FLOOR_FLUTTER_DIR/bin:$PATH"
    - ./tool/verify_sdk_floor.sh

# dart_packages 内含 packages/patchbay/test/command_name_parity_test.dart ——
# 命令名跨包一致护栏（CLI/服务方/fixture 三处钉死）。
dart_packages:
  stage: check
  script:
    # 排版门禁从仓根跑一次，覆盖全部四包与 example，故不在 flutter_package 内重复。
    # 不依赖 pub get：语言版本取各包 pubspec 的 SDK 约束，本仓无 formatter 配置覆盖，
    # 解析与否结果一致（patchbay_flutter 的 analysis_options include 未解析会打 warning，
    # 只是提示，不参与判定）。放在最前面是为了快速失败。
    - dart format --output=none --set-exit-if-changed .
    - dart run tool/check_planning.dart
    - |
      for p in patchbay patchbay_cli patchbay_transport; do
        echo "== packages/$p =="
        (cd "packages/$p" && dart pub get && dart analyze --fatal-infos && dart test)
      done

flutter_package:
  stage: check
  script:
    - cd packages/patchbay_flutter
    - flutter pub get
    - flutter analyze
    - flutter test
    - cd example
    - flutter pub get
    - flutter test

# 四个生成器（含 README 命令参考）都在这里查零漂移。
# wire：生成物 header 记录仓根相对路径，--check 必须从仓根调用（包目录内跑会假漂移）。
# command：header 记录的是相对生成物自身的路径，从哪个目录调用都一致，不必迁就 cwd。
codegen_drift:
  stage: check
  script:
    - (cd packages/patchbay && dart pub get)
    - dart run packages/patchbay/bin/wire_codegen.dart --contract packages/patchbay/contracts/core_wire.json --output packages/patchbay/lib/src/generated/core_wire.g.dart --check
    - dart run packages/patchbay/bin/command_codegen.dart --contract packages/patchbay/contracts/example_commands.json --output packages/patchbay/contracts/example_commands.g.dart --check
    - (cd packages/patchbay_cli && dart pub get && dart run tool/protocol_cli_codegen.dart --check && dart run tool/command_docs.dart --check)
