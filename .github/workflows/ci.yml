# 公开仓 CI 门禁：四个 job 与 GitLab .gitlab-ci.yml 一一对应，但这里只选择
# `tool/repo_tasks.dart` 中的仓内任务，不复制包清单与命令。
# Flutter 版本（上界）与 GitLab CI 镜像 flutter-node:3.44.9 对齐；sdk_floor 跑的是
# pubspec 声明的下限 3.44.0，两个数字不是同一件事，见 docs/compat-matrix.md。
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  # PB-050-12：pubspec 声明的 SDK 下限，由 sdk_floor job 守门。旧声明
  # （Flutter >=3.38.0 + Dart >=3.11.0）指向一个装不出来的组合（3.38.x 全系只内置
  # Dart 3.10.x）；最早可安装的 3.41.x 又缺 Flutter 上游提交 af35e77c83d，导致
  # ui.reveal 的遮挡判定 fail-open。含该修复的第一个 stable 是 3.44.0，实测五包全绿。
  # 事实链与裁决见 docs/proposals/0.5.0/sdk-floor-raise.md。
  SDK_FLOOR_FLUTTER_VERSION: '3.44.0'

jobs:
  dart_packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 排版、规划、analyze + test（根工具与三个纯 Dart 包）
        env:
          PATCHBAY_DART_TEST_TIMEOUT: 90s
        run: dart run tool/repo_tasks.dart dart-packages

  flutter_package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: analyze + test（patchbay_flutter 及 example）
        run: dart run tool/repo_tasks.dart flutter-package

  codegen_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 四个 codegen / docs 零漂移
        run: dart run tool/repo_tasks.dart codegen-drift

  # PB-060-07：逐包 branch coverage 是 informational lane，失败可见但不阻断；
  # 无论采集是否完整都上传已有报告，方便从失败点继续诊断。
  coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 生成逐包 LCOV 与 raw coverage
        env:
          PATCHBAY_DART_TEST_TIMEOUT: 90s
        run: dart run tool/repo_tasks.dart coverage
      - name: 上传 coverage 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchbay-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

  # needs：GitHub Actions 默认每个 job 各自一台 runner，本不存在 GitLab 那种同机资源
  # 争用；这里加 needs 纯粹是为了两边 job 结构与调度顺序保持对应（.gitlab-ci.yml 的
  # sdk_floor 因为实测在 GitLab 共享 runner 上和其余三条 job 抢 CPU/内存/磁盘 I/O、
  # 顶爆过 dart_packages 的一个 30s 超时用例，被挪到了排在 check 之后的独立 stage）。
  #
  # 本 job 是**已验证下限的守门**：跑的版本就是 pubspec 声明的下限，跑红即代表声明下限
  # 不再成立，必须阻断——因此没有 continue-on-error。修复方向只有「修代码让下限重新
  # 成立」或「再走一次 Proposal 调整下限数字」，不允许挂回 continue-on-error 消音。
  sdk_floor:
    needs: [dart_packages, flutter_package, codegen_drift, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.SDK_FLOOR_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 已验证的最低 Flutter / Dart 组合
        run: dart run tool/repo_tasks.dart sdk-floor
