# 公开仓 CI 门禁：四个 job 与 GitLab .gitlab-ci.yml 的四检查项一一对应
# （sdk_floor / dart_packages / flutter_package / codegen_drift），两边改动需同步。
# Flutter 版本（上界）与 GitLab CI 镜像 flutter-node:3.44.9 对齐；sdk_floor 跑的是
# pubspec 声明的下限 3.44.0，两个数字不是同一件事，见 docs/compat-matrix.md。
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  # PB-050-12：pubspec 声明的 SDK 下限，由 sdk_floor job 守门。旧声明
  # （Flutter >=3.38.0 + Dart >=3.11.0）指向一个装不出来的组合（3.38.x 全系只内置
  # Dart 3.10.x）；最早可安装的 3.41.x 又缺 Flutter 上游提交 af35e77c83d，导致
  # ui.reveal 的遮挡判定 fail-open。含该修复的第一个 stable 是 3.44.0，实测五包全绿。
  # 事实链与裁决见 docs/proposals/0.5.0/sdk-floor-raise.md。
  SDK_FLOOR_FLUTTER_VERSION: '3.44.0'

jobs:
  dart_packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 排版门禁从仓根跑一次，覆盖全部四包与 example，故不在 flutter_package 内重复。
      # 不依赖 pub get：语言版本取各包 pubspec 的 SDK 约束，本仓无 formatter 配置覆盖，
      # 解析与否结果一致（patchbay_flutter 的 analysis_options include 未解析会打 warning，
      # 只是提示，不参与判定）。放在 analyze/test 之前是为了快速失败。
      - name: 排版对齐（全仓 dart format）
        run: dart format --output=none --set-exit-if-changed .
      - name: 规划文档一致性
        run: dart run tool/check_planning.dart
      - name: analyze + test（三个纯 Dart 包）
        run: |
          # GH 共享 runner 比 GitLab podman runner 慢，VM Service 跨进程测试首跑会顶到
          # dart test 默认 30s 单测超时，统一上调（GitLab 侧不需要，保持原样）。
          for p in patchbay patchbay_cli patchbay_transport; do
            echo "== packages/$p =="
            (cd "packages/$p" && dart pub get && dart analyze --fatal-infos && dart test --timeout=90s)
          done

  flutter_package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: analyze + test（patchbay_flutter 及 example）
        run: |
          cd packages/patchbay_flutter
          flutter pub get
          flutter analyze
          flutter test
          cd example
          flutter pub get
          flutter test

  codegen_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # wire：生成物 header 记录仓根相对路径，--check 必须从仓根调用（包目录内跑会假漂移）。
      # command：header 记录的是相对生成物自身的路径，从哪个目录调用都一致，不必迁就 cwd。
      - name: 四个 codegen / docs 零漂移
        run: |
          (cd packages/patchbay && dart pub get)
          dart run packages/patchbay/bin/wire_codegen.dart --contract packages/patchbay/contracts/core_wire.json --output packages/patchbay/lib/src/generated/core_wire.g.dart --check
          dart run packages/patchbay/bin/command_codegen.dart --contract packages/patchbay/contracts/example_commands.json --output packages/patchbay/contracts/example_commands.g.dart --check
          (cd packages/patchbay_cli && dart pub get && dart run tool/protocol_cli_codegen.dart --check && dart run tool/command_docs.dart --check)

  # needs：GitHub Actions 默认每个 job 各自一台 runner，本不存在 GitLab 那种同机资源
  # 争用；这里加 needs 纯粹是为了两边 job 结构与调度顺序保持对应（.gitlab-ci.yml 的
  # sdk_floor 因为实测在 GitLab 共享 runner 上和其余三条 job 抢 CPU/内存/磁盘 I/O、
  # 顶爆过 dart_packages 的一个 30s 超时用例，被挪到了排在 check 之后的独立 stage）。
  #
  # 本 job 是**已验证下限的守门**：跑的版本就是 pubspec 声明的下限，跑红即代表声明下限
  # 不再成立，必须阻断——因此没有 continue-on-error。修复方向只有「修代码让下限重新
  # 成立」或「再走一次 Proposal 调整下限数字」，不允许挂回 continue-on-error 消音。
  sdk_floor:
    needs: [dart_packages, flutter_package, codegen_drift]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.SDK_FLOOR_FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 已验证的最低 Flutter / Dart 组合
        run: ./tool/verify_sdk_floor.sh
