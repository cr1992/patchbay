# 公开仓 CI 门禁：三个 job 与 GitLab .gitlab-ci.yml 的三检查项一一对应
# （dart_packages / flutter_package / codegen_drift），两边改动需同步。
# Flutter 版本与 GitLab CI 镜像 flutter-node:3.44.9 对齐。
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  dart_packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 排版门禁从仓根跑一次，覆盖全部四包与 example，故不在 flutter_package 内重复。
      # 不依赖 pub get：语言版本取各包 pubspec 的 SDK 约束，本仓无 formatter 配置覆盖，
      # 解析与否结果一致（patchbay_flutter 的 analysis_options include 未解析会打 warning，
      # 只是提示，不参与判定）。放在 analyze/test 之前是为了快速失败。
      - name: 排版对齐（全仓 dart format）
        run: dart format --output=none --set-exit-if-changed .
      - name: 规划文档一致性
        run: dart run tool/check_planning.dart
      - name: analyze + test（三个纯 Dart 包）
        run: |
          # GH 共享 runner 比 GitLab podman runner 慢，VM Service 跨进程测试首跑会顶到
          # dart test 默认 30s 单测超时，统一上调（GitLab 侧不需要，保持原样）。
          for p in patchbay patchbay_cli patchbay_transport; do
            echo "== packages/$p =="
            (cd "packages/$p" && dart pub get && dart analyze --fatal-infos && dart test --timeout=90s)
          done

  flutter_package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: analyze + test（patchbay_flutter 及 example）
        run: |
          cd packages/patchbay_flutter
          flutter pub get
          flutter analyze
          flutter test
          cd example
          flutter pub get
          flutter test

  codegen_drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # wire：生成物 header 记录仓根相对路径，--check 必须从仓根调用（包目录内跑会假漂移）。
      # command：header 记录的是相对生成物自身的路径，从哪个目录调用都一致，不必迁就 cwd。
      - name: 三个 codegen 零漂移
        run: |
          (cd packages/patchbay && dart pub get)
          dart run packages/patchbay/bin/wire_codegen.dart --contract packages/patchbay/contracts/core_wire.json --output packages/patchbay/lib/src/generated/core_wire.g.dart --check
          dart run packages/patchbay/bin/command_codegen.dart --contract packages/patchbay/contracts/example_commands.json --output packages/patchbay/contracts/example_commands.g.dart --check
          (cd packages/patchbay_cli && dart pub get && dart run tool/protocol_cli_codegen.dart --check)
