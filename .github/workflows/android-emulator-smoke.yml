# 周期性 Android emulator 冒烟：在真实 Android 平台上跑完整条 example 端到端预检。
#
# 与 ci.yml 的分工：ci.yml 是每次推送必过的 analyze / test 门禁，全跑在无设备的容器里，
# 覆盖不到「App 真的装进 Android、VM Service 真的可连、每条命令真的答得出」这段平台链路。
# 本文件补的就是这段，因此只按计划和手动触发，不进合入必过项——它证明的是链路仍然通，
# 不是这次改动对不对。
#
# 跑的是与本地预检**同一个脚本** `tool/example_precheck.sh`（AGENTS.md「联调姿势」定义的那道
# 业务验收前置门）。刻意不在这里另写一份内联断言：两份会漂移，而漂移的那一刻正是「CI 绿了但
# 本地过不了」开始说不清的时候。脚本自己负责编译 CLI 的 AOT 产物、预构建 APK、起 App、逐条
# 打通命令面并给出每步退出码。
#
# Flutter 版本与 ci.yml 保持同一常量，三处（本文件 / ci.yml / 内网主仓镜像）需同步。
#
# example 不带平台目录（见 packages/patchbay_flutter/example/README.md），
# Android 工程在 CI 内临时生成、用完即弃，不入库。
name: Android emulator smoke

on:
  schedule:
    # 每周一 03:17 UTC。错开整点，避开计划任务高峰。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android_emulator_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 生成的 Android 工程要求 JDK 17（app/build.gradle.kts 的 sourceCompatibility）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: A 生成 example 的 Android 平台工程
        run: |
          set -euo pipefail
          cd packages/patchbay_flutter/example
          flutter create --platforms=android --org dev.patchbay \
            --project-name patchbay_flutter_example .
          # flutter create 顺手补的默认 widget 测试引用模板里的 MyApp，与本 example 的
          # main.dart 不是一回事。冒烟不跑测试，删掉免得日后误读。
          rm -f test/widget_test.dart
          test -f android/app/build.gradle.kts

      - name: B 预热依赖与 debug APK
        run: |
          set -euo pipefail
          (cd packages/patchbay_cli && dart pub get)
          cd packages/patchbay_flutter/example
          flutter pub get
          # 预热放在 emulator 之外：Gradle 首跑最慢，且「构建失败」与「跑起来后答不出」
          # 是两件事，分开才能在日志里一眼分辨断在哪一头。预检脚本里同样会调一次
          # flutter build apk --debug，那次是增量的，几秒即可。

      - name: C 打开 KVM 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: D emulator 上跑完整 example 端到端预检
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"

            # 等 emulator 真的可用：android-emulator-runner 在 boot 完成后就交出控制权，
            # 但 sys.boot_completed 之前 adb 里的设备还接不了 install。
            for _ in $(seq 1 60); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 5
            done
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] \
              || { echo "::error::emulator 未进入 boot_completed"; exit 1; }

            # 预检脚本自己会挑第一台 online 设备、编 CLI 的 AOT、预构建 APK、起 App、
            # 逐条跑命令面。失败时它列出失败步骤并以非 0 退出。
            ./tool/example_precheck.sh

      - name: E 失败时保留脱敏日志
        if: failure()
        run: |
          set -uo pipefail
          # VM Service URI 带认证材料：只上传已脱敏的行。
          for f in "${TMPDIR:-/tmp}"/patchbay-flutter-run.*; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")（URI 已抹除）"
            sed -E 's#(ws|http)s?://[^[:space:]]+#<redacted-uri>#g' "$f" | tail -n 120
            echo "::endgroup::"
          done
