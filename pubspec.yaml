name: patchbay_repo
description: Private repository automation for the Patchbay workspace.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

workspace:
  - packages/patchbay
  - packages/patchbay_cli
  - packages/patchbay_flutter
  - packages/patchbay_transport

dev_dependencies:
  # 仓内工具用：`tool/check_api_closure.dart` 靠 analyzer 的 element model 计算
  # 「公共入口是否自足」，这是编译器口径，不是正则口径。仅 repo-only 工具使用，
  # 四个发布包都不依赖它。
  analyzer: ^12.1.0
  coverage: ^1.15.0
  lints: ^6.1.0
  test: ^1.25.0
