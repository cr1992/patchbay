name: patchbay_cli
description: 'Command line client for Patchbay: connect to a running Flutter app over VM Service or direct HTTP, invoke commands, drive UI, pull logs and screenshots.'
repository: https://github.com/cr1992/patchbay
version: 0.3.0

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  patchbay: ^0.3.0
  patchbay_transport: ^0.3.0
  vm_service: ^15.0.0
  yaml: ^3.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0

executables:
  patchbay: patchbay
  patchbay-permission-android: patchbay_permission_android
  patchbay-permission-ios: patchbay_permission_ios
