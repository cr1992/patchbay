name: patchbay_cli
description: Consumer-neutral CLI client for Patchbay VM Service extensions.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  patchbay:
    path: ../patchbay
  patchbay_transport:
    path: ../patchbay_transport
  vm_service: ^15.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0

executables:
  patchbay: patchbay
