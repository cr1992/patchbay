# 与 pub.dev 评分口径对齐：pana 按 package:lints/core.yaml 计分。
include: package:lints/core.yaml

analyzer:
  errors:
    dead_code: error
    unused_element: error
    unused_import: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - only_throw_errors
    - prefer_final_locals
    - unawaited_futures
