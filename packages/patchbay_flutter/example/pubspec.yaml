name: patchbay_flutter_example
description: Minimal consumer-neutral Patchbay Flutter integration example.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  patchbay_flutter:
    path: ..
  # 可选的 direct HTTP 面：默认不启动，只有 --dart-define=patchbay.direct=1 才绑端口。
  # 接在这里是为了让本地预检能验证「VM Service 与 direct 对共享能力答复一致」。
  patchbay_transport:
    path: ../../patchbay_transport
  # The example is the consumer-side permission-request reference. Patchbay's
  # reusable packages stay independent of any particular permission plugin.
  permission_handler: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
