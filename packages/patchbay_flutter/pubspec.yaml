name: patchbay_flutter
description: 'Optional low-intrusion Flutter bridge for Patchbay: stable UI targets, Semantics observation and actions, navigation, waits and capture.'
repository: https://github.com/cr1992/patchbay
version: 0.3.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  patchbay: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
